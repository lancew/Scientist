author           = Lance Wicks <lw@judocoach.com>
copyright_holder = Lance Wicks
copyright_year   = 2016
license          = MIT
name             = Scientist
version          = 0.015

[AutoPrereqs]
[GatherDir]
    exclude_filename = README.pod
    exclude_filename = dist.ini
[GitHub::Meta]
[License]
[MakeMaker]
[Manifest]
[MetaYAML]
[MetaJSON]
[MetaProvides::Package]
[OurPkgVersion]
;[PrereqsClean] - Broken.
[Prereqs]
Time::HiRes = 0
[Readme]
[TestRelease]
[ConfirmRelease]
[UploadToCPAN]
[RunExtraTests]

; Use TestingMania bundle without:
;  - Test::DistManifest: Dist::Zilla should create the MANIFEST* files, not us,
;    so it's silly to test for.
;  - Test::Portability: filename portability checks are too strict for the
;    files we ship; skip them during test/release.
[@Filter]
-bundle = @TestingMania
-remove = Test::DistManifest
-remove = Test::Portability
